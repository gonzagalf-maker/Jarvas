<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvas</title>

<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;background:#080d16;color:#e5f3ff;font-family:Arial,sans-serif}
button,input,select{font:inherit}
button{padding:10px;background:#19bde5;color:#06131c;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
header{padding:12px;text-align:center;border-bottom:1px solid #17344a}
h1{margin:0;color:#42d9ff;letter-spacing:5px}
header p{margin:5px 0}
#layout{display:flex;height:calc(100dvh - 79px)}
#lateral{width:245px;flex-shrink:0;background:#0c1522;border-right:1px solid #17344a;padding:10px;display:flex;flex-direction:column;gap:10px}
#nova{width:100%}
#lista{overflow:auto;flex:1}
.itemConversa{display:flex;gap:5px;margin-bottom:7px}
.selecionarConversa{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#122438;color:#e5f3ff;font-weight:normal}
.selecionarConversa.ativa{border:1px solid #42d9ff;background:#07546b}
.excluir{padding:8px;background:#40232d;color:#fff}
#principal{display:flex;flex:1;min-width:0;flex-direction:column}
#barra{display:flex;align-items:center;gap:7px;padding:8px;border-bottom:1px solid #17344a}
#menu{display:none}
#titulo{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:#b8d7eb}
.controle{background:#122438;color:#e5f3ff;border:1px solid #29465b;padding:8px}
.controle.ativo{background:#07546b;border-color:#42d9ff}
#status{font-size:12px;color:#8daec4;padding:5px 10px;min-height:24px}
#chat{flex:1;min-height:0;overflow:auto;padding:12px}
.msg{padding:12px;margin:10px 0;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{background:#122438;margin-right:5%}
.user{background:#07546b;margin-left:8%}
.msg img{display:block;max-width:100%;max-height:300px;margin-top:8px;border-radius:8px}
.msgAudio{display:flex;gap:6px;margin-top:9px}
.msgAudio button{padding:6px 10px}
