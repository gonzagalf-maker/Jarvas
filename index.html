<!-- Carrega a ponte compilada para a voz nativa -->
<script src="./tts.js"></script>

<script>
'use strict';

const $ = id => document.getElementById(id);

const chat = $('chat');
const entrada = $('entrada');
const statusEl = $('status');
const lista = $('lista');
const lateral = $('lateral');

const CHAVECONVERSAS = 'jarvas_conversas_v1';
const CHAVEANTIGA = 'jarvas_mensagens';

let conversas = [];
let conversaAtual = null;
let fotoPendente = null;
let reconhecimento = null;
let ouvindo = false;
let falaAutomatica = false;

let textoPDFAtual = '';
let filaPDF = [];
let indicePDF = 0;
let pdfFalando = false;
let pdfPausado = false;
let pdfToken = 0;
let vozToken = 0;

function idNovo(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

function definirStatus(texto){
  statusEl.textContent = texto;
}

function conversaSelecionada(){
  return conversas.find(c => c.id === conversaAtual) || null;
}

function tituloDaConversa(c){
  const primeira = c.mensagens.find(m => m.eu && m.texto);
  if(!primeira) return 'Nova conversa';
  const t = primeira.texto.trim();
  return t.length > 32 ? t.slice(0,32) + '…' : t;
}

function salvarConversas(){
  try{
    localStorage.setItem(CHAVECONVERSAS, JSON.stringify(conversas));
    return true;
  }catch(e){
    definirStatus('Armazenamento cheio. Algumas alterações podem não ter sido salvas.');
    return false;
  }
}

function carregarConversas(){
  try{
    const salvo = JSON.parse(localStorage.getItem(CHAVECONVERSAS) || 'null');
    if(Array.isArray(salvo)){
      conversas = salvo.filter(c => c && c.id && Array.isArray(c.mensagens));
    }
  }catch(e){
    conversas = [];
  }

  if(!conversas.length){
    try{
      const antigas = JSON.parse(localStorage.getItem(CHAVEANTIGA) || '[]');
      if(Array.isArray(antigas) && antigas.length){
        conversas = [{
          id:idNovo(),
          mensagens:antigas,
          criada:Date.now()
        }];
        salvarConversas();
      }
    }catch(e){}
  }

  if(!conversas.length){
    conversas = [{
      id:idNovo(),
      mensagens:[{
        texto:'Olá! Sou o Jarvas. Minha interface está pronta; minha IA ainda será integrada.',
        eu:false
      }],
      criada:Date.now()
    }];
    salvarConversas();
  }

  conversaAtual = conversas[conversas.length - 1].id;
}

function renderizarLista(){
  lista.replaceChildren();

  conversas.slice().reverse().forEach(c => {
    const linha = document.createElement('div');
    linha.className = 'itemConversa';

    const selecionar = document.createElement('button');
    selecionar.type = 'button';
    selecionar.className = 'selecionarConversa' +
      (c.id === conversaAtual ? ' ativa' : '');
    selecionar.textContent = tituloDaConversa(c);
    selecionar.title = tituloDaConversa(c);
    selecionar.addEventListener('click', () => abrirConversa(c.id));

    const excluir = document.createElement('button');
    excluir.type = 'button';
    excluir.className = 'excluir';
    excluir.textContent = '×';
    excluir.title = 'Excluir esta conversa';
    excluir.setAttribute('aria-label','Excluir ' + tituloDaConversa(c));
    excluir.addEventListener('click', () => excluirConversa(c.id));

    linha.append(selecionar, excluir);
    lista.appendChild(linha);
  });
}

function renderizarChat(){
  const c = conversaSelecionada();
  chat.replaceChildren();

  $('titulo').textContent = c ? tituloDaConversa(c) : 'Nova conversa';

  if(!c || !c.mensagens.length){
    const vazio = document.createElement('div');
    vazio.id = 'avisoVazio';
    vazio.textContent = 'Conversa nova. Escreva uma mensagem para começar.';
    chat.appendChild(vazio);
  }else{
    c.mensagens.forEach(m => mostrar(m));
  }

  chat.scrollTop = chat.scrollHeight;
  renderizarLista();
}

function mostrar(m){
  const d = document.createElement('div');
  d.className = 'msg ' + (m.eu ? 'user' : 'bot');

  const texto = document.createElement('div');
  texto.textContent = (m.eu ? 'Você: ' : 'Jarvas: ') + (m.texto || '');
  d.appendChild(texto);

  if(m.imagem){
    const img = document.createElement('img');
    img.src = m.imagem;
    img.alt = 'Foto enviada na conversa';
    img.loading = 'lazy';
    d.appendChild(img);
  }

  if(!m.eu && m.texto){
    const acoes = document.createElement('div');
    acoes.className = 'msgAudio';

    const ouvir = document.createElement('button');
    ouvir.type = 'button';
    ouvir.textContent = '🔊 Ouvir';
    ouvir.addEventListener('click', () => falar(m.texto));

    acoes.appendChild(ouvir);
    d.appendChild(acoes);
  }

  chat.appendChild(d);
}

function adicionarMensagem(m){
  const c = conversaSelecionada();
  if(!c) return;

  c.mensagens.push(m);
  salvarConversas();
  renderizarChat();
}

function abrirConversa(id){
  if(!conversas.some(c => c.id === id)) return;
  pararVoz();
  pararLeituraPDF();
  conversaAtual = id;
  renderizarChat();
  if(window.innerWidth <= 600) lateral.classList.add('fechada');
}

function novaConversa(){
  pararVoz();
  pararLeituraPDF();

  const c = {
    id:idNovo(),
    mensagens:[],
    criada:Date.now()
  };

  conversas.push(c);
  conversaAtual = c.id;
  salvarConversas();
  renderizarChat();
  entrada.focus();

  if(window.innerWidth <= 600) lateral.classList.add('fechada');
}

function excluirConversa(id){
  const c = conversas.find(x => x.id === id);
  if(!c) return;

  if(!confirm('Excluir a conversa "' + tituloDaConversa(c) + '"?')) return;

  conversas = conversas.filter(x => x.id !== id);

  if(!conversas.length){
    conversas.push({id:idNovo(),mensagens:[],criada:Date.now()});
  }

  if(conversaAtual === id) conversaAtual = conversas[conversas.length - 1].id;

  salvarConversas();
  renderizarChat();
  definirStatus('Conversa excluída.');
}

$('nova').addEventListener('click',novaConversa);

$('limparHistorico').addEventListener('click',() => {
  if(!confirm('Excluir TODAS as conversas deste aplicativo?')) return;

  conversas = [{id:idNovo(),mensagens:[],criada:Date.now()}];
  conversaAtual = conversas[0].id;
  salvarConversas();
  renderizarChat();
  definirStatus('Histórico de conversas limpo.');
});

$('menu').addEventListener('click',() => {
  lateral.classList.toggle('fechada');
});

function enviar(){
  const texto = entrada.value.trim();
  if(!texto) return;

  adicionarMensagem({texto,eu:true});
  entrada.value = '';

  const resposta = 'Recebi sua mensagem. A IA local ainda será integrada.';
  adicionarMensagem({texto:resposta,eu:false});

  if(falaAutomatica) falar(resposta);
}

$('botaoEnviar').addEventListener('click',enviar);
entrada.addEventListener('keydown',e => {
  if(e.key === 'Enter') enviar();
});

/* SÍNTESE DE VOZ NATIVA DO ANDROID */

async function falar(texto){
  if(!window.JarvasTTS ||
     typeof window.JarvasTTS.speak !== 'function'){
    definirStatus('Integração de voz não carregada. Confira se tts.js está no APK.');
    return;
  }

  const token = ++vozToken;

  pararLeituraPDF();

  try{
    await window.JarvasTTS.stop();

    if(token !== vozToken) return;

    definirStatus('Preparando voz…');

    await window.JarvasTTS.speak(String(texto), 1);

    if(token === vozToken){
      definirStatus('Jarvas pronto.');
    }
  }catch(e){
    if(token === vozToken){
      console.error('Erro na síntese de voz:',e);
      definirStatus('Falha na voz. Confira se há um mecanismo de síntese instalado no Android.');
    }
  }
}

function pararVoz(){
  vozToken++;

  if(window.JarvasTTS &&
     typeof window.JarvasTTS.stop === 'function'){
    window.JarvasTTS.stop().catch(e => {
      console.warn('Não foi possível parar a voz:',e);
    });
  }
}

$('pararVoz').addEventListener('click',() => {
  pararVoz();
  pararLeituraPDF();
  definirStatus('Reprodução interrompida.');
});

$('vozAutomatica').addEventListener('click',() => {
  falaAutomatica = !falaAutomatica;

  try{
    localStorage.setItem('jarvas_fala_automatica',String(falaAutomatica));
  }catch(e){}

  $('vozAutomatica').textContent = falaAutomatica
    ? '🔊 Voz automática'
    : '🔇 Voz automática';

  $('vozAutomatica').classList.toggle('ativo',falaAutomatica);
  definirStatus(falaAutomatica ? 'Voz automática ativada.' : 'Voz automática desativada.');

  if(!falaAutomatica) pararVoz();
});

try{
  falaAutomatica = localStorage.getItem('jarvas_fala_automatica') === 'true';
}catch(e){}

$('vozAutomatica').classList.toggle('ativo',falaAutomatica);
$('vozAutomatica').textContent = falaAutomatica
  ? '🔊 Voz automática'
  : '🔇 Voz automática';

function prepararImagem(file){
  return new Promise((resolve,reject) => {
    const leitor = new FileReader();

    leitor.onerror = () => reject(new Error('Não foi possível ler a imagem.'));

    leitor.onload = () => {
      const imagem = new Image();

      imagem.onerror = () => reject(new Error('Não foi possível abrir a imagem.'));

      imagem.onload = () => {
        const escala = Math.min(1,1000 / Math.max(imagem.width,imagem.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1,Math.round(imagem.width * escala));
        canvas.height = Math.max(1,Math.round(imagem.height * escala));

        const contexto = canvas.getContext('2d');
        if(!contexto) return reject(new Error('Falha ao processar imagem.'));

        contexto.drawImage(imagem,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.72));
      };

      imagem.src = leitor.result;
    };

    leitor.readAsDataURL(file);
  });
}

$('fotoBotao').addEventListener('click',() => $('arquivoFoto').click());

$('arquivoFoto').addEventListener('change',async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;

  try{
    fotoPendente = await prepararImagem(file);
    $('previa').src = fotoPendente;
    $('selecaoFoto').style.display = 'block';
  }catch(err){
    alert(err.message || 'Erro ao carregar foto.');
  }
});

$('cancelarFoto').addEventListener('click',() => {
  fotoPendente = null;
  $('previa').removeAttribute('src');
  $('selecaoFoto').style.display = 'none';
});

$('enviarFoto').addEventListener('click',() => {
  if(!fotoPendente) return;

  adicionarMensagem({texto:'Foto enviada',imagem:fotoPendente,eu:true});
  fotoPendente = null;
  $('previa').removeAttribute('src');
  $('selecaoFoto').style.display = 'none';

  const resposta = 'Recebi sua foto. A IA ainda não está integrada para analisá-la.';
  adicionarMensagem({texto:resposta,eu:false});
  if(falaAutomatica) falar(resposta);
});

/* MICROFONE: permanece com a API do navegador por enquanto.
   A integração nativa do reconhecimento será uma etapa separada. */

function iniciarReconhecimento(){
  const API = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!API){
    definirStatus('Reconhecimento de fala indisponível neste ambiente.');
    alert('O reconhecimento de fala não está disponível neste WebView. Precisaremos integrar o microfone nativo do Android.');
    return;
  }

  if(ouvindo && reconhecimento){
    reconhecimento.stop();
    return;
  }

  reconhecimento = new API();
  reconhecimento.lang = 'pt-BR';
  reconhecimento.continuous = false;
  reconhecimento.interimResults = true;
  reconhecimento.maxAlternatives = 1;

  reconhecimento.onstart = () => {
    ouvindo = true;
    $('microfone').textContent = '⏹ Parar';
    $('microfone').classList.add('ativo');
    definirStatus('Estou ouvindo…');
  };

  reconhecimento.onresult = event => {
    let final = '';
    let parcial = '';

    for(let i = event.resultIndex;i < event.results.length;i++){
      if(event.results[i].isFinal) final += event.results[i][0].transcript;
      else parcial += event.results[i][0].transcript;
    }

    if(final.trim()){
      entrada.value = (entrada.value + ' ' + final).trim();
      definirStatus('Texto reconhecido. Confira antes de enviar.');
    }else if(parcial){
      definirStatus('Ouvindo: ' + parcial);
    }
  };

  reconhecimento.onerror = event => {
    definirStatus('Erro no microfone: ' + event.error);
  };

  reconhecimento.onend = () => {
    ouvindo = false;
    $('microfone').textContent = '🎤 Falar';
    $('microfone').classList.remove('ativo');
    if(!entrada.value.trim()) definirStatus('Jarvas pronto.');
  };

  try{
    reconhecimento.start();
  }catch(e){
    definirStatus('Não foi possível iniciar o microfone.');
  }
}

$('microfone').addEventListener('click',iniciarReconhecimento);

/* PDF.js local */

$('pdfBotao').addEventListener('click',() => $('arquivoPDF').click());

$('arquivoPDF').addEventListener('change',async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;

  pararVoz();
  pararLeituraPDF();
  $('painelPDF').style.display = 'block';
  $('nomePDF').textContent = file.name;
  $('textoPDF').textContent = 'Extraindo texto do PDF…';
  textoPDFAtual = '';

  try{
    const pdfjs = await import('./pdfjs/pdf.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc = './pdfjs/pdf.worker.mjs';

    const buffer = await file.arrayBuffer();
    const pdf = await pdfjs.getDocument({data:new Uint8Array(buffer)}).promise;
    const paginas = [];

    for(let n = 1;n <= pdf.numPages;n++){
      definirStatus('Lendo página ' + n + ' de ' + pdf.numPages + '…');
      const pagina = await pdf.getPage(n);
      const conteudo = await pagina.getTextContent();
      const texto = conteudo.items.map(item => item.str || '').join(' ');
      paginas.push('Página ' + n + '\n' + texto);
    }

    textoPDFAtual = paginas.join('\n\n').trim();

    if(!textoPDFAtual){
      $('textoPDF').textContent =
        'Não encontrei texto selecionável. Este PDF pode ser digitalizado como imagem; será necessário OCR.';
      definirStatus('PDF sem texto extraível.');
      return;
    }

    $('textoPDF').textContent = textoPDFAtual;
    definirStatus('PDF carregado: ' + pdf.numPages + ' página(s).');
  }catch(err){
    console.error(err);
    $('textoPDF').textContent =
      'Não foi possível abrir o PDF. Verifique se a biblioteca PDF.js foi incluída no APK e tente novamente.';
    definirStatus('Falha ao abrir o PDF.');
  }
});

function dividirTexto(texto,tamanho=220){
  const palavras = texto.split(/\s+/);
  const partes = [];
  let atual = '';

  for(const palavra of palavras){
    if((atual + ' ' + palavra).trim().length > tamanho && atual){
      partes.push(atual);
      atual = palavra;
    }else{
      atual = (atual + ' ' + palavra).trim();
    }
  }

  if(atual) partes.push(atual);
  return partes;
}

/* Leitura do PDF pela mesma voz nativa */

async function lerProximaParte(token){
  if(!window.JarvasTTS){
    pdfFalando = false;
    definirStatus('Integração de voz não carregada.');
    return;
  }

  while(token === pdfToken && pdfFalando && indicePDF < filaPDF.length){
    if(pdfPausado){
      await new Promise(resolve => setTimeout(resolve,150));
      continue;
    }

    const parte = filaPDF[indicePDF];

    try{
      await window.JarvasTTS.speak(
        parte,
        Number($('velocidade').value)
      );

      if(token !== pdfToken) return;

      // Se foi pausado durante a fala, repete este trecho ao retomar.
      if(pdfPausado) continue;

      indicePDF++;
    }catch(e){
      if(token !== pdfToken) return;

      // O stop da pausa pode interromper a fala atual.
      if(pdfPausado) continue;

      console.error('Erro na leitura do PDF:',e);
      pdfFalando = false;
      definirStatus('Falha na voz durante a leitura do PDF.');
      return;
    }
  }

  if(token === pdfToken && pdfFalando && indicePDF >= filaPDF.length){
    pdfFalando = false;
    definirStatus('Leitura do PDF concluída.');
  }
}

$('lerPDF').addEventListener('click',async () => {
  if(!textoPDFAtual){
    definirStatus('Abra primeiro um PDF com texto selecionável.');
    return;
  }

  if(!window.JarvasTTS){
    definirStatus('Integração de voz não carregada.');
    return;
  }

  pararVoz();
  pararLeituraPDF();

  filaPDF = dividirTexto(textoPDFAtual);
  indicePDF = 0;
  pdfFalando = true;
  pdfPausado = false;
  const token = pdfToken;

  definirStatus('Iniciando leitura do PDF…');
  await lerProximaParte(token);
});

$('pausarPDF').addEventListener('click',async () => {
  if(!pdfFalando) return;

  if(!pdfPausado){
    pdfPausado = true;
    $('pausarPDF').textContent = '▶ Continuar';

    try{
      await window.JarvasTTS.stop();
    }catch(e){}

    definirStatus('Leitura pausada. Toque em Continuar para retomar.');
  }else{
    pdfPausado = false;
    $('pausarPDF').textContent = '⏸ Pausar';
    definirStatus('Retomando leitura do PDF…');
  }
});

function pararLeituraPDF(){
  pdfToken++;
  pdfFalando = false;
  pdfPausado = false;
  filaPDF = [];
  indicePDF = 0;
  $('pausarPDF').textContent = '⏸ Pausar';

  if(window.JarvasTTS){
    window.JarvasTTS.stop().catch(e => {
      console.warn('Erro ao interromper PDF:',e);
    });
  }
}

$('pararPDF').addEventListener('click',() => {
  pararLeituraPDF();
  definirStatus('Leitura do PDF interrompida.');
});

$('fecharPDF').addEventListener('click',() => {
  pararLeituraPDF();
  $('painelPDF').style.display = 'none';
});

carregarConversas();
renderizarChat();

</script>
