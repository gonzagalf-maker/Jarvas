<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvas</title>

<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;background:#080d16;color:#e5f3ff;font-family:Arial,sans-serif}
button,input,select{font:inherit}
button{padding:10px;background:#19bde5;color:#06131c;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
header{padding:12px;text-align:center;border-bottom:1px solid #17344a}
h1{margin:0;color:#42d9ff;letter-spacing:5px}
header p{margin:5px 0}
#layout{display:flex;height:calc(100dvh - 79px)}
#lateral{width:245px;flex-shrink:0;background:#0c1522;border-right:1px solid #17344a;padding:10px;display:flex;flex-direction:column;gap:10px}
#nova{width:100%}
#lista{overflow:auto;flex:1}
.itemConversa{display:flex;gap:5px;margin-bottom:7px}
.selecionarConversa{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#122438;color:#e5f3ff;font-weight:normal}
.selecionarConversa.ativa{border:1px solid #42d9ff;background:#07546b}
.excluir{padding:8px;background:#40232d;color:#fff}
#principal{display:flex;flex:1;min-width:0;flex-direction:column}
#barra{display:flex;align-items:center;gap:7px;padding:8px;border-bottom:1px solid #17344a}
#menu{display:none}
#titulo{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:#b8d7eb}
.controle{background:#122438;color:#e5f3ff;border:1px solid #29465b;padding:8px}
.controle.ativo{background:#07546b;border-color:#42d9ff}
#status{font-size:12px;color:#8daec4;padding:5px 10px;min-height:24px}
#chat{flex:1;min-height:0;overflow:auto;padding:12px}
.msg{padding:12px;margin:10px 0;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{background:#122438;margin-right:5%}
.user{background:#07546b;margin-left:8%}
.msg img{display:block;max-width:100%;max-height:300px;margin-top:8px;border-radius:8px}
.msgAudio{display:flex;gap:6px;margin-top:9px}
.msgAudio button{padding:6px 10px}
#ferramentas{display:flex;flex-wrap:wrap;gap:7px;padding:8px 10px;border-top:1px solid #17344a}
#modoConversa.ativo{background:#0b7a4b;border-color:#3be39a}
#painelPDF{display:none;padding:10px;background:#101e2d;border-top:1px solid #29465b;max-height:62%;overflow:auto}
#textoPDF{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.4;color:#8daec4}
#visorPDF{position:relative;overflow:auto;max-height:44dvh;margin-top:8px;background:#0b1420;border-radius:8px;padding:6px}
.paginaPDF{position:relative;margin:0 auto 8px;background:#fff;box-shadow:0 0 0 1px #29465b}
.paginaPDF canvas{display:block;width:100%;height:100%;cursor:pointer}
.marcaInicio{position:absolute;background:rgba(255,214,0,.4);border-bottom:2px solid #ffb300;pointer-events:none}
#irPagina{width:70px;padding:8px;background:#111e2d;color:white;border:1px solid #29465b;border-radius:8px}
#buscaPDF{width:150px;padding:8px;background:#111e2d;color:white;border:1px solid #29465b;border-radius:8px}
#resultadosPDF, #painelFavoritos{display:none;max-height:130px;overflow:auto;margin:6px 0;background:#0b1420;border-radius:8px;padding:4px}
.resultadoPDF, .itemFavorito{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:transparent;color:#e5f3ff;font-weight:normal;border-bottom:1px solid #17344a;border-radius:0;font-size:13px;padding:6px}
.itemFavorito button{background:#40232d;color:#fff;padding:4px 8px;font-size:11px}
.semResultado{padding:10px;font-size:13px;color:#8daec4}
#buscaConversas{width:100%;padding:10px;background:#111e2d;color:white;border:1px solid #29465b;border-radius:8px;font-size:14px}
.fonte{margin-top:6px;font-size:12px;color:#8daec4;overflow-wrap:anywhere}
#controlesPDF{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px;align-items:center}
#controlesPDF select{padding:8px;background:#111e2d;color:white;border:1px solid #29465b;border-radius:8px}
footer{display:flex;gap:7px;padding:10px;border-top:1px solid #17344a}
#entrada{flex:1;min-width:0;padding:12px;background:#111e2d;color:white;border:1px solid #29465b;border-radius:8px;font-size:16px}
#arquivoFoto,#arquivoPDF{display:none}
#selecaoFoto{display:none;padding:10px;background:#111e2d}
#previa{display:block;max-width:100%;max-height:180px;margin:auto auto 10px}
.acoesFoto{display:flex;justify-content:center;gap:8px}
#cancelarFoto{background:#34485a;color:white}
#avisoVazio{color:#8daec4;text-align:center;padding:30px 12px}
@media(max-width:600px){
 #lateral{position:fixed;z-index:5;top:79px;bottom:0;left:0;width:min(290px,85vw);box-shadow:8px 0 25px #0009}
 #lateral.fechada{display:none}
 #menu{display:block}
 #barra{gap:5px}
 #titulo{font-size:12px}
 #chat{padding:8px}
 .msg{padding:10px}
}
</style>
</head>

<body>
<header>
  <h1>JARVAS</h1>
  <p>Assistente pessoal</p>
</header>

<div id="layout">
  <aside id="lateral">
    <button id="nova" type="button">＋ Nova conversa</button>
    <input id="buscaConversas" type="search" placeholder="Buscar nas conversas" autocomplete="off">
    <div id="lista"></div>
    <button id="limparHistorico" class="controle" type="button">Limpar todas as conversas</button>
  </aside>

  <main id="principal">
    <div id="barra">
      <button id="menu" class="controle" type="button">☰</button>
      <span id="titulo">Nova conversa</span>
      <button id="vozAutomatica" class="controle" type="button">🔇 Voz automática</button>
    </div>

    <div id="status" aria-live="polite">Jarvas pronto.</div>
    <section id="chat" aria-live="polite"></section>

    <section id="painelPDF">
      <div id="controlesPDF">
        <strong id="nomePDF">Documento PDF</strong>
        <button id="lerPDF" type="button">▶ Ler PDF</button>
        <button id="pausarPDF" type="button">⏸ Pausar</button>
        <button id="pararPDF" type="button">⏹ Parar</button>
        <button id="favoritarPagina" class="controle" type="button">⭐ Favoritar Pág.</button>
        <button id="verFavoritos" class="controle" type="button">📑 Favoritos (0)</button>
        <label for="velocidade">Velocidade</label>
        <select id="velocidade">
          <option value="0.7">Lenta</option>
          <option value="0.9">Normal lenta</option>
          <option value="1" selected>Normal</option>
          <option value="1.2">Rápida</option>
          <option value="1.4">Muito rápida</option>
        </select>
        <label for="irPagina">Página</label>
        <input id="irPagina" type="number" min="1" inputmode="numeric">
        <button id="irBotao" class="controle" type="button">Ir</button>
        <input id="buscaPDF" type="search" placeholder="Buscar no PDF" autocomplete="off">
        <button id="buscarPDF" class="controle" type="button">🔍</button>
        <button id="recolherPDF" class="controle" type="button">▼ Recolher</button>
        <button id="fecharPDF" class="controle" type="button">Fechar PDF</button>
      </div>
      <div id="resultadosPDF"></div>
      <div id="painelFavoritos"></div>
      <div id="textoPDF">Selecione um PDF.</div>
      <div id="visorPDF"></div>
    </section>

    <section id="selecaoFoto">
      <p>Conferir foto antes de enviar:</p>
      <img id="previa" alt="Prévia da foto">
      <div class="acoesFoto">
        <button id="cancelarFoto" type="button">Cancelar</button>
        <button id="enviarFoto" type="button">Enviar foto</button>
      </div>
    </section>

    <div id="ferramentas">
      <button id="modoConversa" class="controle" type="button">🎧 Modo conversa</button>
      <button id="fotoBotao" class="controle" type="button">📷 Foto</button>
      <button id="pdfBotao" class="controle" type="button">📄 Abrir PDF</button>
      <button id="mostrarPDF" class="controle" type="button" style="display:none">📖 Mostrar PDF</button>
      <button id="microfone" class="controle" type="button">🎤 Falar</button>
      <button id="pesquisarWeb" class="controle" type="button">🌐 Pesquisar</button>
      <button id="ouvirUltima" class="controle" type="button">🔊 Ouvir última</button>
      <button id="pararVoz" class="controle" type="button">⏹ Parar voz</button>
    </div>

    <footer>
      <input id="entrada" placeholder="Digite ou dite uma mensagem" autocomplete="off">
      <button id="botaoEnviar" type="button">Enviar</button>
    </footer>
  </main>
</div>

<input id="arquivoFoto" type="file" accept="image/*">
<input id="arquivoPDF" type="file" accept="application/pdf,.pdf">

<script src="./tts.js"></script>

<script>
'use strict';

const $ = id => document.getElementById(id);
const esperar = ms => new Promise(r => setTimeout(r,ms));
const norm = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

const chat = $('chat');
const entrada = $('entrada');
const statusEl = $('status');
const lista = $('lista');
const lateral = $('lateral');

const CHAVECONVERSAS = 'jarvas_conversas_v1';
const CHAVEANTIGA = 'jarvas_mensagens';

let conversas = [];
let conversaAtual = null;
let fotoPendente = null;
let falaAutomatica = false;
let enviando = false;
let modoConversa = false;
let wakeLock = null;

let textoPDFAtual = '';
let filaPDF = [];
let indicePDF = 0;
let pdfFalando = false;
let pdfPausado = false;
let pdfToken = 0;
let vozToken = 0;

let paginasFavoritas = [];

function idNovo(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

function definirStatus(texto){
  statusEl.textContent = texto;
}

function conversaSelecionada(){
  return conversas.find(c => c.id === conversaAtual) || null;
}

function tituloDaConversa(c){
  const primeira = c.mensagens.find(m => m.eu && m.texto);
  if(!primeira) return 'Nova conversa';
  const t = primeira.texto.trim();
  return t.length > 32 ? t.slice(0,32) + '…' : t;
}

function salvarConversas(){
  try{
    localStorage.setItem(CHAVECONVERSAS, JSON.stringify(conversas));
    return true;
  }catch(e){
    return false;
  }
}

function carregarConversas(){
  try{
    const salvo = JSON.parse(localStorage.getItem(CHAVECONVERSAS) || 'null');
    if(Array.isArray(salvo)) conversas = salvo.filter(c => c && c.id && Array.isArray(c.mensagens));
  }catch(e){ conversas = []; }

  if(!conversas.length){
    conversas = [{id:idNovo(), mensagens:[{texto:'Olá! Sou o Jarvas.', eu:false}], criada:Date.now()}];
    salvarConversas();
  }
  conversaAtual = conversas[conversas.length - 1].id;
}

function renderizarLista(){
  lista.replaceChildren();
  conversas.slice().reverse().forEach(c => {
    const rotulo = tituloDaConversa(c);
    const linha = document.createElement('div');
    linha.className = 'itemConversa';

    const selecionar = document.createElement('button');
    selecionar.type = 'button';
    selecionar.className = 'selecionarConversa' + (c.id === conversaAtual ? ' ativa' : '');
    selecionar.textContent = rotulo;
    selecionar.addEventListener('click', () => abrirConversa(c.id));

    const excluir = document.createElement('button');
    excluir.type = 'button';
    excluir.className = 'excluir';
    excluir.textContent = '×';
    excluir.addEventListener('click', () => excluirConversa(c.id));

    linha.append(selecionar, excluir);
    lista.appendChild(linha);
  });
}

function renderizarChat(){
  const c = conversaSelecionada();
  chat.replaceChildren();
  $('titulo').textContent = c ? tituloDaConversa(c) : 'Nova conversa';
  if(!c || !c.mensagens.length){
    const vazio = document.createElement('div');
    vazio.id = 'avisoVazio';
    vazio.textContent = 'Conversa nova. Escreva uma mensagem para começar.';
    chat.appendChild(vazio);
  }else{
    c.mensagens.forEach(m => mostrar(m));
  }
  chat.scrollTop = chat.scrollHeight;
  renderizarLista();
}

function mostrar(m){
  const d = document.createElement('div');
  d.className = 'msg ' + (m.eu ? 'user' : 'bot');
  const texto = document.createElement('div');
  texto.textContent = (m.eu ? 'Você: ' : 'Jarvas: ') + (m.texto || '');
  d.appendChild(texto);
  chat.appendChild(d);
}

function adicionarMensagem(m){
  const c = conversaSelecionada();
  if(!c) return;
  c.mensagens.push(m);
  salvarConversas();
  renderizarChat();
}

function abrirConversa(id){
  conversaAtual = id;
  renderizarChat();
}

async function responder(texto){
  if(window.JarvasIA && typeof window.JarvasIA.gerar === 'function'){
    const r = await window.JarvasIA.gerar({prompt:texto});
    return (r && r.texto) ? r.texto : String(r);
  }
  return 'Recebi sua mensagem. A IA local ainda será integrada.';
}

async function enviarTexto(texto){
  if(enviando) return;
  enviando = true;
  adicionarMensagem({texto, eu:true});
  const resposta = await responder(texto);
  adicionarMensagem({texto:resposta, eu:false});
  enviando = false;
}

function enviar(){
  const texto = entrada.value.trim();
  if(!texto) return;
  entrada.value = '';
  enviarTexto(texto);
}

$('botaoEnviar').addEventListener('click', enviar);
entrada.addEventListener('keydown', e => { if(e.key === 'Enter') enviar(); });

/* ============================================================
   LEITOR DE PDF E FAVORITOS
   ============================================================ */
let pdfPaginas = [];
let pdfInicio = {pagina:0, item:0};
let filaPaginas = [];
let filaPDFInfo = [];
let ultimaPaginaRolada = -1;
let observadorPDF = null;
let pdfDocAtual = null;

function montarTextoPagina(itens){
  let texto = '';
  let ultimo = null;
  for(const item of itens){
    const str = item.str || '';
    const t = item.transform || [];
    const x = t[4], y = t[5];
    const tamanho = Math.abs(t[0]) || item.height || 10;
    if(ultimo && typeof x === 'number' && typeof y === 'number'){
      if(Math.abs(y - ultimo.y) > tamanho * 0.5){
        if(!/\s$/.test(texto)) texto += ' ';
      }
    }
    texto += str;
    if(typeof x === 'number' && typeof y === 'number') ultimo = {fim:x + (item.width || 0), y};
  }
  return texto.replace(/[ \t]+/g,' ').trim();
}

$('pdfBotao').addEventListener('click', () =>$('arquivoPDF').click());

function limparVisorPDF(){
  if(observadorPDF) observadorPDF.disconnect();
  pdfPaginas = [];
  pdfInicio = {pagina:0, item:0};
  paginasFavoritas = [];
  atualizarBotaoFavoritos();
  $('visorPDF').replaceChildren();
  $('resultadosPDF').replaceChildren();$('painelFavoritos').replaceChildren();
  $('resultadosPDF').style.display = 'none';$('painelFavoritos').style.display = 'none';
}

function rolarParaPagina(i){
  const pg = pdfPaginas[i];
  if(!pg) return;
  $('visorPDF').scrollTo({top:Math.max(0,pg.div.offsetTop - 4), behavior:'smooth'});
}

function irParaPaginaDireta(numPagina){
  const idx = numPagina - 1;
  const pg = pdfPaginas[idx];
  if(!pg) return;
  pdfInicio = {pagina:idx, item:0};
  rolarParaPagina(idx);
  definirStatus('Ir para a página ' + numPagina);
}

function atualizarBotaoFavoritos(){
  $('verFavoritos').textContent = '📑 Favoritos (' + paginasFavoritas.length + ')';
}

$('favoritarPagina').addEventListener('click', () => {
  if(!pdfPaginas.length) return;
  const paginaAtual = pdfInicio.pagina + 1;
  if(!paginasFavoritas.includes(paginaAtual)){
    paginasFavoritas.push(paginaAtual);
    paginasFavoritas.sort((a,b) => a - b);
    atualizarBotaoFavoritos();
    definirStatus('Página ' + paginaAtual + ' favoritada!');
  }else{
    definirStatus('A página ' + paginaAtual + ' já está nos favoritos.');
  }
});

$('verFavoritos').addEventListener('click', () => {
  const painel = $('painelFavoritos');
  painel.replaceChildren();
  if(!paginasFavoritas.length){
    definirStatus('Nenhuma página favoritada ainda.');
    painel.style.display = 'none';
    return;
  }
  paginasFavoritas.forEach(p => {
    const div = document.createElement('div');
    div.className = 'itemFavorito';
    
    const btnIr = document.createElement('button');
    btnIr.style.background = 'transparent';
    btnIr.style.color = '#e5f3ff';
    btnIr.style.border = '0';
    btnIr.style.cursor = 'pointer';
    btnIr.textContent = '📄 Ir para a Página ' + p;
    btnIr.addEventListener('click', () => { irParaPaginaDireta(p); painel.style.display = 'none'; });

    const btnRemover = document.createElement('button');
    btnRemover.textContent = 'Remover';
    btnRemover.addEventListener('click', () => {
      paginasFavoritas = paginasFavoritas.filter(x => x !== p);
      atualizarBotaoFavoritos();
      div.remove();
      if(!paginasFavoritas.length) painel.style.display = 'none';
    });

    div.append(btnIr, btnRemover);
    painel.appendChild(div);
  });
  painel.style.display = painel.style.display === 'block' ? 'none' : 'block';
});

$('arquivoPDF').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;

  limparVisorPDF();
  $('painelPDF').style.display = 'block';$('nomePDF').textContent = file.name;
  $('textoPDF').textContent = 'Abrindo o PDF…';

  try{
    const pdfjs = await import('./pdfjs/pdf.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc = './pdfjs/pdf.worker.mjs';

    const buffer = await file.arrayBuffer();
    const pdf = await pdfjs.getDocument({data:new
