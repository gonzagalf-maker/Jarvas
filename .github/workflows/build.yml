name: Compilar Jarvas APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version: 20

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 21

  - name: Instalar dependências
    run: npm install

  - name: Preparar arquivos web
    run: |
      mkdir -p www
      cp index.html www/index.html

  - name: Criar projeto Android
    run: npx cap add android

  - name: Verificar inicialização Android
    run: grep -n -E 'MAIN|LAUNCHER' android/app/src/main/AndroidManifest.xml

  - name: Sincronizar aplicativo
    run: npx cap sync android

  - name: Compilar APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Disponibilizar APK
    uses: actions/upload-artifact@v4
    with:
      name: Jarvas-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
