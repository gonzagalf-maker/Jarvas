name: Compilar Jarvas APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Preparar arquivos web
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Verificar icones Android
        run: |
          ls -la android/app/src/main/res/mipmap-hdpi
          ls -la android/app/src/main/res/mipmap-mdpi
          ls -la android/app/src/main/res/mipmap-xhdpi

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verificar APK gerado
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          "$AAPT" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -E "package:|application-label:|launchable-activity:"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvas-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
